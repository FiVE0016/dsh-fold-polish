name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build consistency and Node behavior tests
        run: npm test
      - name: Real Chromium acceptance
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run test:browser
